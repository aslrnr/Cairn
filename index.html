<style>
/* Layout: one full-viewport stage; canvas scaled to fit 16:9, HTML overlays for text. Single dark look by choice. */
:root{
  --ink:#0b0a0e; --stone:#17161c; --stone2:#221f28; --line:#3a3542;
  --bone:#e6dcc0; --dim:#9a917f; --ember:#e48a3c; --ember2:#ffb866; --blood:#c8434a; --moss:#8fa86f;
  --display:"Cinzel", "Iowan Old Style", Georgia, serif;
  --body:"Crimson Pro", "Iowan Old Style", Georgia, serif;
  --pix:"Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--body)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink)}
#wrap{position:relative;width:480px;height:270px;flex:none}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair}
.ov{position:absolute;pointer-events:none;font-family:var(--pix);font-weight:500;letter-spacing:.03em;font-variant-numeric:lining-nums tabular-nums}
#bossName{top:calc(var(--s)*19px);left:0;right:0;text-align:center;font-family:var(--display);font-size:calc(var(--s)*9px);letter-spacing:.12em;color:var(--bone);text-shadow:0 1px 0 #000,0 0 6px #000}
#hudR{top:calc(var(--s)*6px);right:calc(var(--s)*8px);text-align:right;font-size:calc(var(--s)*7px);line-height:1.3;text-shadow:0 1px 0 #000}
#hudR .gold{color:var(--ember2);font-size:calc(var(--s)*9px);display:inline-block;transform-origin:right center;animation:bump .2s}
@keyframes bump{from{transform:scale(1.3)}to{transform:scale(1)}}
#relics .chip{pointer-events:auto;cursor:help}
#hudR .depth{color:var(--dim)}
#relics{left:calc(var(--s)*6px);bottom:calc(var(--s)*5px);display:flex;flex-direction:column;gap:calc(var(--s)*2px);font-size:calc(var(--s)*6px);max-width:60%}
#relics .row{display:flex;flex-wrap:wrap;gap:calc(var(--s)*2px)}
.chip{background:rgba(10,9,13,.72);border:1px solid var(--line);padding:calc(var(--s)*1px) calc(var(--s)*3px);border-radius:2px;display:flex;align-items:center;gap:calc(var(--s)*2px);white-space:nowrap}
.dot{width:calc(var(--s)*3px);height:calc(var(--s)*3px);border-radius:50%;display:inline-block;flex:none}
.set{color:var(--ember2)}
#prompt{transform:translate(-50%,-100%);background:rgba(10,9,13,.88);border:1px solid var(--line);padding:calc(var(--s)*2px) calc(var(--s)*4px);font-size:calc(var(--s)*6.5px);text-align:center;max-width:calc(var(--s)*170px);white-space:normal;line-height:1.35}
#prompt b{color:var(--ember2);font-weight:600}
#prompt .desc{color:var(--dim)}
#toast{top:22%;left:50%;transform:translateX(-50%);font-family:var(--body);font-style:italic;font-size:calc(var(--s)*9px);color:var(--bone);text-shadow:0 2px 6px #000;text-align:center;opacity:0;transition:opacity .6s;width:80%}
#banner{top:34%;left:0;right:0;text-align:center;font-family:var(--display);opacity:0;transition:opacity 1.2s;text-shadow:0 3px 12px #000}
#banner .t{font-size:calc(var(--s)*20px);letter-spacing:.06em}
#banner .s{font-size:calc(var(--s)*8px);color:var(--dim);font-family:var(--body);font-style:italic}
/* modal */
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,4,8,.62);pointer-events:auto}
#modal .box{background:var(--stone);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 18px 60px #000;padding:calc(var(--s)*9px) calc(var(--s)*11px);max-width:min(88%,calc(var(--s)*300px));max-height:86%;overflow:auto;font-size:calc(var(--s)*7.5px)}
#modal h2{font-family:var(--display);font-weight:400;margin:0 0 .3em;font-size:1.7em;letter-spacing:.04em;text-wrap:balance}
#modal p{margin:.2em 0 .8em;color:var(--dim);line-height:1.4}
#modal .btns{display:flex;flex-direction:column;gap:.45em}
button{font:inherit;color:var(--bone);background:var(--stone2);border:1px solid var(--line);padding:.5em .8em;text-align:left;cursor:pointer;border-radius:2px}
button:hover,button:focus-visible{border-color:var(--ember);outline:none;background:#2b2530}
button:disabled{opacity:.4;cursor:default}
button .k{color:var(--ember2);font-family:var(--pix);margin-right:.5em}
button small{display:block;color:var(--dim);font-size:.85em;margin-top:.15em}
/* camp */
#camp{position:absolute;inset:0;display:flex;justify-content:flex-end;pointer-events:none}
#camp .panel{pointer-events:auto;width:52%;height:100%;box-sizing:border-box;background:linear-gradient(90deg,rgba(11,10,14,0),rgba(11,10,14,.86) 14%,rgba(11,10,14,.95));padding:calc(var(--s)*10px) calc(var(--s)*12px) calc(var(--s)*10px) calc(var(--s)*26px);overflow:auto;font-size:calc(var(--s)*6.6px)}

.up .ds{color:var(--dim);font-size:.9em;line-height:1.3}
.up .cost{font-family:var(--pix);color:var(--ember2);font-size:.9em}
.up.maxed .cost{color:var(--moss)}
#go{font-family:var(--display);font-size:1.6em;text-align:center;width:100%;padding:.45em;background:#3a2318;border-color:var(--ember);letter-spacing:.06em}
#go:hover,#go:focus-visible{background:#4d2d1d}
.opts{display:flex;gap:.6em;align-items:center;margin:.5em 0;color:var(--dim);flex-wrap:wrap}
.ctl{margin-top:.9em;color:var(--dim);line-height:1.5;font-size:.92em}
.ctl kbd{font-family:var(--pix);color:var(--bone);background:var(--stone2);border:1px solid var(--line);padding:0 .3em;border-radius:2px;font-size:.9em}
.hint{margin-top:.6em;color:var(--dim);font-size:.85em}
/* touch */
#touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px)) ;pointer-events:none;z-index:5}
#touch .grp{display:flex;gap:10px;pointer-events:auto}
#touch .tb{width:58px;height:58px;border-radius:50%;background:rgba(40,36,46,.55);border:1px solid rgba(230,220,192,.25);color:var(--bone);font-family:var(--pix);font-size:13px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
#touch .tb.on{background:rgba(228,138,60,.45)}
#pauseBtn{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:6;display:none;font-family:var(--pix);padding:.3em .7em}
@media (max-width:700px){#camp .panel{width:100%;background:rgba(11,10,14,.93);padding-left:calc(var(--s)*12px)} .ups{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#toast,#banner{transition:none}}
</style>

</div>

function tone(f,d,type='square',v=.04,f2=null,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(masterOut);o.start(t);o.stop(t+d+.02)}

const POOL=['hall','pit','tower','mound','corridor','climb','pillars','vault','bridge','ziggurat','gallery'];

// ================== level ==================
let L=null, levelCanvas=null, bgCanvas=null;
function buildLevel(depth){
  const seq=['start'];
  const n=4+Math.min(depth,6);
  const mid=Math.floor(n/2);
  const free=shuffle([...Array(n).keys()].filter(i=>i!==mid));
  const special={};special[mid]='cairn';special[free.pop()]='oddity';if(n>=6)special[free.pop()]='oddity';
  let prev='';
  for(let i=0;i<n;i++){
    if(special[i])seq.push(special[i]);
    else{let k;do{k=pick(POOL)}while(k===prev);prev=k;seq.push(k)}
  }
  const isBoss=depth%3===0;
  if(isBoss){seq.push('cairn','boss')}
  seq.push('exit');
  // the main path drops through the ruin: each descent is a shaft or an open chasm, two or three storeys tall
  const nd=depth>=3?2:1;
  const dpos=nd===2?[ri(2,mid),ri(mid+2,n)]:[ri(2,n)];
  const dh=dpos.map(()=>2);if(depth>=2&&R()<.5)dh[ri(0,dh.length-1)]=3;
  for(let i=dpos.length-1;i>=0;i--)seq.splice(dpos[i],0,{desc:dh[i]});
  const cols=seq.length;
  const BANDS=2+dh.reduce((a,h)=>a+h-1,0)+1;
  const grid={};const G=(b,c)=>grid[b+','+c];const setG=(b,c,k)=>{grid[b+','+c]=k};
  const vlink=new Set();const mainCells=[];
  {let b=1;seq.forEach((k,c)=>{
    if(k.desc){const chasm=R()<.6;
      for(let j=0;j<k.desc;j++){setG(b+j,c,chasm?(j===0?'chasmT':j===k.desc-1?'chasmB':'chasmM'):(j===0?'shaftU':j===k.desc-1?'shaftL':'chasmM'));if(j)vlink.add((b+j)+','+c)}
      b+=k.desc-1}
    else{setG(b,c,k);if(POOL.includes(k)&&c>1)mainCells.push([b,c])}})}
  // side branches: up to halls above, down to crypts below
  const ends=shuffle(['trove','oddity','trove','oddity']);ends.push('shop');
  const nBr=2+(depth>=2?1:0)+(depth>=5?1:0);let made=0;
  for(const [b,c] of shuffle(mainCells)){
    if(made>=nBr)break;
    const dirs=shuffle([-1,1]).filter(d=>b+d>=0&&b+d<BANDS&&!G(b+d,c));if(!dirs.length)continue;
    const d=dirs[0],tb=b+d;
    let ext=[];const hd=shuffle([-1,1]);
    for(const dir of hd){const len=ri(d<0?1:0,2);const cells=[];for(let j=1;j<=len;j++){const cc=c+dir*j;if(cc<1||cc>=cols-1||G(tb,cc))break;cells.push(cc)}if(cells.length){ext=cells;break}}
    if(d<0){setG(b,c,'shaftL');setG(tb,c,'shaftU');vlink.add(b+','+c)}
    else{setG(b,c,'drop');setG(tb,c,ext.length?'shaftL':'crypt');vlink.add(tb+','+c)}
    ext.forEach((cc,i)=>setG(tb,cc,i===ext.length-1?(ends.pop()||'trove'):pick(POOL)));
    made++;
  }
  const W=cols*24, H=BANDS*18;
  const t=new Uint8Array(W*H).fill(1);
  const lvlObj={w:W,h:H,t,depth,pal:PALS[(depth-1)%PALS.length],ents:[],enemies:[],coins:[],projs:[],parts:[],fires:[],bones:0,start:{x:40,y:200},isBoss,rooms:[],cols,bands:BANDS,seen:new Set(),safe:[],marks:[],npcSpots:[]};
  const oddPool=shuffle([...ODDITIES]);const tabUsed=[];
  for(let band=0;band<BANDS;band++)for(let c=0;c<cols;c++){
    const key=G(band,c);if(!key)continue;
    lvlObj.rooms.push({c,b:band,key,vu:vlink.has(band+','+c),vd:vlink.has((band+1)+','+c)});
    const mirror=POOL.includes(key)&&R()<.5;
    const ox=c*24, oy=band*18;
    const openL=!!G(band,c-1), openR=!!G(band,c+1);
    if(key==='shop')lvlObj.safe.push({x0:ox*T,x1:(ox+24)*T,y0:oy*T,y1:(oy+18)*T,openL,openR});
    const rows=TPL[key].map(r=>r.padEnd(24,'#').slice(0,24));
    for(let y=0;y<18;y++){
      let row=rows[y];if(mirror)row=row.split('').reverse().join('');
      for(let x=0;x<24;x++){
        let ch=row[x];
        if(x===0||x===23){
          const open=x===0?openL:openR;
          if(!open)ch='#';
          else if(y>=11&&y<=15)ch=ch==='#'?'.':ch;
          else if(y>=16)ch='#';
        }
        if(key==='boss'&&x===23&&y>=11&&y<=15)ch='G';
        const gx=ox+x, gy=oy+y, idx=gy*W+gx;
        let v=0;
        if(ch==='#')v=1;else if(ch==='=')v=2;else if(ch==='B')v=3;else if(ch==='^')v=4;else if(ch==='G')v=5;
        t[idx]=v;
        const px=gx*T, py=gy*T;
        switch(ch){
          case '$':lvlObj.coins.push(mkCoin(px+8,py+8,ri(1,2)+Math.floor(depth/2),true));break;
          case 'E':spawnFoe(lvlObj,randEnemyType(depth),px,py,depth);break;
          case 'N':lvlObj.npcSpots.push({x:px,y:py});break;
          case 'e':{const en=mkEnemy(randEnemyType(depth),px,py,depth,true);lvlObj.enemies.push(en);break}
          case 'W':lvlObj.enemies.push(mkEnemy('wisp',px,py,depth));break;
          case 'C':if(depth>=2&&R()<.08){const m=mkEnemy('mimic',px+1,py+6,depth);lvlObj.enemies.push(m)}else lvlObj.ents.push({type:'chest',x:px+1,y:py+6,w:14,h:10});break;
          case 'R':lvlObj.ents.push({type:'relic',id:randRelic(),x:px+3,y:py+4,w:10,h:12,pedestal:true});break;
          case 'K':lvlObj.ents.push({type:'cairn',x:px-2,y:py-8,w:20,h:24,used:false});break;
          case 'X':lvlObj.ents.push({type:'exit',x:px-8,y:py-16,w:32,h:32});break;
          case 'P':lvlObj.start={x:px,y:py+2};break;
          case 'O':{const bt=depth%9===0?'firstp':depth%6===0?'bellmother':'warden';const b=mkEnemy(bt,px-16,py+16-EN[bt].h-(bt==='bellmother'?60:0),depth);b.floorY=py+16;lvlObj.enemies.push(b);break}
          case '?':spawnOddity(lvlObj,oddPool.pop()||'well',px,py,depth);break;
          case 'S':lvlObj.ents.push({type:'peddler',x:px-4,y:py-8,w:20,h:24});break;
          case 'w':{const used=lvlObj.ents.filter(e=>e.type==='ware').map(e=>e.id);const id=randRelic(used);lvlObj.ents.push({type:'ware',kind:'relic',id,price:Math.round(ri(45,70)*(1+.2*(depth-1))*(RELICS[id].tag==='Hex'?.6:1)/5)*5,x:px+3,y:py+4,w:10,h:12});break}
          case 'f':lvlObj.ents.push({type:'ware',kind:'flask',price:Math.round(30*(1+.15*(depth-1))/5)*5,x:px+3,y:py+4,w:10,h:12});break;
        }
      }
    }
    if(POOL.includes(key)){
      const floorSpots=[],ceilSpots=[];
      for(let y=3;y<16;y++)for(let x=2;x<22;x++){const v=t[(oy+y)*W+ox+x],b=t[(oy+y+1)*W+ox+x],a=t[(oy+y-1)*W+ox+x];
        if(y>=11&&v===0&&b===1)floorSpots.push([ox+x,oy+y]);
        if(y<=10&&v===0&&a===1&&t[(oy+y+1)*W+ox+x]===0&&t[(oy+y+2)*W+ox+x]===0&&t[(oy+y+3)*W+ox+x]===0)ceilSpots.push([ox+x,oy+y])}
      const extra=(depth<3?ri(1,2):ri(0,1+Math.floor(depth/3)))+(band===0?1:0);
      for(let i=0;i<extra&&floorSpots.length;i++){const [fx,fy]=floorSpots.splice(ri(0,floorSpots.length-1),1)[0];spawnFoe(lvlObj,randEnemyType(depth),fx*T,fy*T,depth)}
      if(ceilSpots.length&&R()<.3+.05*depth){const [bx,by]=pick(ceilSpots);const bat=mkEnemy('bat',bx*T+3,by*T,depth);bat.homeX=bat.x;bat.homeY=bat.y;lvlObj.enemies.push(bat)}
      if(floorSpots.length&&R()<.12){const [sx_,sy_]=pick(floorSpots);lvlObj.enemies.push(mkEnemy('scarab',sx_*T+3,sy_*T+8,depth))}
      if(floorSpots.length&&R()<.24){const [tx_,ty_]=floorSpots.splice(ri(0,floorSpots.length-1),1)[0];
        const unseen=INSCRIPTIONS.map((_,i)=>i).filter(i=>!save.lore.includes(i)&&!tabUsed.includes(i));
        const idx=unseen.length&&R()<.85?pick(unseen):ri(0,INSCRIPTIONS.length-1);tabUsed.push(idx);
        lvlObj.ents.push({type:'tablet',idx,x:tx_*T+3,y:ty_*T+1,w:10,h:15})}
    }
  }
  for(let y=0;y<H;y++){t[y*W]=1;t[y*W+W-1]=1}
  placeNpc(lvlObj,depth);
  decorate(lvlObj);
  return lvlObj;
}
function randEnemyType(d){
  const w=[['husk',4],['mite',1.6],['blob',1.8],['wisp',2.2],['leaper',2.5],['shield',d>=2?2+d*.3:1.2],['spitter',d>=2?2:1.2]];
  if(d>=2)w.push(['knight',d>=3?.5+d*.3:.7]);
  if(d>=2)w.push(['archer',1.8]);
  if(d>=3)w.push(['wheel',1.4],['censer',1.4]);
  if(d>=4)w.push(['wraith',1.5],['cantor',1.4]);
  let s=w.reduce((a,b)=>a+b[1],0),r=R()*s;for(const [k,v] of w){r-=v;if(r<=0)return k}return 'husk';
}

  const ids=Object.keys(RELICS).filter(id=>!exclude.includes(id)&&!(P&&P.relics&&P.relics.includes(id)));

function spawnOddity(lv,kind,px,py,depth){
  switch(kind){

function tagCount(tag){return P.relics.filter(id=>RELICS[id].tag===tag).length}

function recalc(){
  const base=5+lvl('vigor')+(has('vein')?1:0)+(setOn('Blood')?2:0)+(P.boons.hale?2:0)-P.hpTax;
  const old=P.maxhp;P.maxhp=Math.max(1,base);
  if(P.maxhp>old)P.hp+=P.maxhp-old;
  if(has('glass'))P.maxhp=Math.min(P.maxhp,2);
  P.hp=Math.min(P.hp,P.maxhp);
  P.slots=3+lvl('satchel')+(setOn('Hex')?1:0);

// ================== tiles & physics ==================
function tileAt(tx,ty){if(tx<0||tx>=L.w||ty<0)return 1;if(ty>=L.h)return 1;return L.t[ty*L.w+tx]}
const solid=v=>v===1||v===3||v===5;
function moveX(o,dx){
  o.x+=dx;const top=Math.floor(o.y/T),bot=Math.floor((o.y+o.h-.01)/T);
  if(dx>0){const tx=Math.floor((o.x+o.w)/T);for(let ty=top;ty<=bot;ty++)if(solid(tileAt(tx,ty))){o.x=tx*T-o.w-.001;o.vx=0;o.hitWall=1;return}}
  else if(dx<0){const tx=Math.floor(o.x/T);for(let ty=top;ty<=bot;ty++)if(solid(tileAt(tx,ty))){o.x=(tx+1)*T+.001;o.vx=0;o.hitWall=-1;return}}
}
function moveY(o,dy,drop){
  const prevB=o.y+o.h;o.y+=dy;o.onGround=false;
  const l=Math.floor(o.x/T),r=Math.floor((o.x+o.w-.01)/T);
  if(dy>0){const ty=Math.floor((o.y+o.h)/T);for(let tx=l;tx<=r;tx++){const v=tileAt(tx,ty);if(solid(v)||(v===2&&!drop&&prevB<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.onGround=true;return}}}
  else if(dy<0){const ty=Math.floor(o.y/T);for(let tx=l;tx<=r;tx++)if(solid(tileAt(tx,ty))){o.y=(ty+1)*T;o.vy=0;return}}
}
function groundUnder(o){const ty=Math.floor((o.y+o.h+1)/T),l=Math.floor(o.x/T),r=Math.floor((o.x+o.w-.01)/T);for(let tx=l;tx<=r;tx++){const v=tileAt(tx,ty);if(solid(v)||v===2)return true}return false}
function ledgeAhead(e){const fx=Math.floor((e.face>0?e.x+e.w+2:e.x-2)/T),fy=Math.floor((e.y+e.h+2)/T);const v=tileAt(fx,fy);return !(solid(v)||v===2)}
function overSpike(o){const y=Math.floor((o.y+o.h-3)/T),l=Math.floor((o.x+2)/T),r=Math.floor((o.x+o.w-2)/T);for(let x=l;x<=r;x++)if(tileAt(x,y)===4)return true;return false}

function finishEnemy(e,dt,flying){
  if(!e.bellId)for(const z of L.safe){if(e.x+e.w>z.x0&&e.x<z.x1&&e.y+e.h>z.y0&&e.y<z.y1){
    const left=z.openL&&(!z.openR||e.x+e.w/2<(z.x0+z.x1)/2);
    if(left){e.x=z.x0-e.w-1;e.face=-1}else if(z.openR){e.x=z.x1+1;e.face=1}else continue;
    e.vx=0;e.atk=null;if(e.type==='bat')e.st='return';else if(e.st==='dash'||e.st==='lunge'||e.st==='slash'||e.st==='bash'||e.st==='roll'){e.st='rest';e.t=1}
    if(e.type==='scarab')e.dirLock=e.face}}
  if(!flying){
    e.vy=Math.min(e.vy+900*dt,360);e.hitWall=0;
    if(Math.abs(e.vx)>0)moveX(e,e.vx*dt);moveY(e,e.vy*dt,false);
    if(e.y>L.h*T)e.dead=true;
  }
  if(e.atk&&!e.atkHit&&P.dodgeT>0&&!P.perfect&&!dying&&overlap(e.atk,{x:P.x-3,y:P.y-3,w:P.w+6,h:P.h+6}))perfectDodge();
  if(e.atk&&!e.atkHit&&!dying&&overlap(e.atk,P)){hurtPlayer(e.x+e.w/2);e.atkHit=P.inv>0}
  if(['rest','walk','idle','float','chase','hang','return','hover','ground','sleep'].includes(e.st))e.atkHit=false;
}

function updateProjs(dt){
  for(const p of L.projs){
    p.life-=dt;
    if(!p.friendly)for(const z of L.safe)if(p.x>z.x0&&p.x<z.x1&&p.y>z.y0&&p.y<z.y1)p.life=0;
    if(p.grav)p.vy+=p.grav*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind==='wave'){
      const box={x:p.x-5,y:p.y,w:10,h:10};
      if(solid(tileAt(Math.floor(p.x/T),Math.floor((p.y+5)/T)))||!solid(tileAt(Math.floor(p.x/T),Math.floor((p.y+12)/T))))p.life=0;
      if(R()<.6)part(p.x,p.y+8,rnd(-20,20),rnd(-60,-20),.3,L.pal.hi,1);
      if(overlap(box,P)){hurtPlayer(p.x-p.vx);}
      continue;
    }
    if(solid(tileAt(Math.floor(p.x/T),Math.floor(p.y/T)))){p.life=0;if(p.kind==='coal'){burst(p.x,p.y-3,'#ff8a4a',10);sfx('zap')}if(p.kind==='rock'){shake=2;for(let i=0;i<8;i++)part(p.x,p.y,rnd(-80,80),rnd(-100,0),.5,L.pal.stone,2,true)}continue}
    if(p.friendly){
      for(const e of L.enemies){if(e.dead)continue;if(p.x>e.x-p.r&&p.x<e.x+e.w+p.r&&p.y>e.y-p.r&&p.y<e.y+e.h+p.r){if(p.kind==='bolt'){zapLine(p.x-p.vx*.05,p.y,p.x,p.y);lightningHit(e,p.dmg)}else hurtEnemy(e,p.dmg,'shard');p.life=0;break}}
    } else {
      const b={x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2};
      if(overlap(b,P)&&P.dodgeT>0&&!P.perfect)perfectDodge();
      if(overlap(b,P)&&P.dodgeT<=0&&P.inv<=0){hurtPlayer(p.x-p.vx);p.life=0}
    }
  }
  L.projs=L.projs.filter(p=>p.life>0);
}

    const dx=P.x+5-c.x,dy=P.y+7-c.y,d=Math.hypot(dx,dy);

    else if(!c.rest){c.vy+=600*dt;c.x+=c.vx*dt;

  for(const p of lv.props){
    if(p.k==='torch')lv.lights.push({x:p.x,y:p.y-8,r:78,c:'255,150,70',a:.22,fl:1,fire:p});
    else if(p.k==='brazier'||p.k==='brazierW')lv.lights.push({x:p.x,y:p.y-(p.k==='brazier'?14:8),r:90,c:'255,130,60',a:.25,fl:1,fire:p});

    if(!adj)continue;const x=x0+r.c*(cw+g),y=y0+r.b*(ch+g);

    if(seen&&ROOM_ICON[r.key]){ctx.fillStyle=ROOM_ICON[r.key];ctx.fillRect(x+2,y+1,2,2)}
    if(r.vu){ctx.fillStyle='rgba(230,220,192,.42)';ctx.fillRect(x+2,y-g,2,g)}
    if(r.c===pc&&r.b===pb&&Math.floor(gtime*3)%2){ctx.fillStyle='#fff';ctx.fillRect(x,y,cw,1);ctx.fillRect(x,y+ch-1,cw,1);ctx.fillRect(x,y,1,ch);ctx.fillRect(x+cw-1,y,1,ch)}
  }
}
function drawBossBar(){
  const b=L.enemies.find(e=>e.boss&&e.st!=='idle');const bn=document.getElementById('bossName');const nm=b&&state==='play'?(b.name||''):'';if(bn.textContent!==nm)bn.textContent=nm;if(!b)return;
  const w=200,x=Math.round(VW/2-w/2),y=34;
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x-1,y-1,w+2,6);ctx.fillStyle='#3a1a1e';ctx.fillRect(x,y,w,4);
  ctx.fillStyle='#c8434a';ctx.fillRect(x,y,Math.max(0,w*b.hp/b.maxhp),4);ctx.fillStyle='#f08a8a';ctx.fillRect(x,y,Math.max(0,w*b.hp/b.maxhp),1);
}
function warePrice(en){return Math.max(5,Math.round(en.price*(has('tongue')?.67:1)))}
function codexHtml(){return Object.keys(RELICS).map(id=>save.seen.includes(id)?`<div style="margin:.35em 0">${relicLabel(id)}<br><span style="font-size:.9em">${RELICS[id].d}</span><br><span style="font-size:.85em;font-style:italic;color:var(--dim)">${RLORE[id]||''}</span></div>`:`<div style="margin:.35em 0;opacity:.4">? ? ?</div>`).join('')}

// ================== main loop ==================
let last=performance.now(),acc=0;
function frame(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;pollPad();musicTick(dt);
  if(state==='run'&&L){
    if(fadeDir>0){fadeA+=dt*3.2;if(fadeA>=1){fadeA=1;fadeDir=-1;const cb=fadeCb;fadeCb=null;cb&&cb()}}else if(fadeDir<0){fadeA-=dt*1.5;if(fadeA<=0){fadeA=0;fadeDir=0}}
    if(slowT>0)slowT-=dt;
    if(!modalOpen&&fadeDir<=0){acc+=dt*(slowT>0?.3:1);let steps=0;while(acc>=STEP&&steps<6){update(STEP);acc-=STEP;steps++;for(const k in pressed)pressed[k]=false}}else{acc=0;for(const k in pressed)pressed[k]=false}
    if(state==='run'&&L){drawRun();if(fadeA>0){ctx.fillStyle=`rgba(0,0,0,${fadeA})`;ctx.fillRect(0,0,VW,VH)}updateHud();}
    updatePrompt();
  } else {gtime+=dt;drawCamp();$('prompt').hidden=true;for(const k in pressed)pressed[k]=false}
  requestAnimationFrame(frame);
}
toCamp();
if(save.runs===0&&save.gold===0){openModal('Cairn','A ruin under a hill, different every time you go down. Find treasure, fell strange things, stack a stone when you come home. There is no clock here. Go slowly or go fast.',[{label:'Sit by the fire'}],()=>{})}
requestAnimationFrame(frame);
window.__cairn={mk:mkEnemy,addRelic:id=>addRelic(id,true),enterDepth:d=>enterDepth(d),get P(){return P},get L(){return L},get state(){return state},startRun,save};
</script>
